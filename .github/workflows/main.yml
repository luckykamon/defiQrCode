name: Deploy Node.js app to server

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Sync files to Server
        uses: pantharshit00/rsync-deploy@v1.0.1
        with:
          switches: -avz --delete
          remote_host: ${{ secrets.HOST_LWS_SERVER }}
          remote_user: ${{ secrets.USERNAME_LWS_SERVER }}
          remote_key: ${{ secrets.SSH_KEY_LWS_SERVER }}
          path: "."
          remote_path: "/srv/defiQrCode"

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_LWS_SERVER }}
          username: ${{ secrets.USERNAME_LWS_SERVER }}
          password: ${{ secrets.PASSWORD_LWS_SERVER }}
          script: |
            cd /srv/defiQrCode
            npm i
            npm run build
