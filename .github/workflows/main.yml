name: Deploy to FTP Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm i

      - name: Install react-script global
        run: npm install -g react-scripts

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@3.1.1
        with:
          ftp-server: ftp://${{ secrets.FTP_SERVER_LWS }}/${{ secrets.FTP_DIRECTORY_LWS }}
          ftp-username: ${{ secrets.FTP_USERNAME_LWS }}
          ftp-password: ${{ secrets.FTP_PASSWORD_LWS }}
          local-dir: ./build
