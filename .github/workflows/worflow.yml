name: Deploy Node.js app to server

on:
  push:
    branches:
      - main
      - dev
      - cypress

env:
  REMOTE_PATH: ''
  PM2_APP_NAME: ''
  FRONT_URL: ''

jobs:
  tests-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.15.0'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.8.0
        with:
          mongodb-version: '6.0.6'
          mongodb-replica-set: test-rs
          mongodb-port: 42069

      - name: Install dependencies
        run: |
          cd front
          cp .env.ci .env
          set -a # permet d'exporter automatiquement toutes les variables définies ou modifiées par la suite
          source .env
          set +a # désactive l'exportation automatique
          echo "PORT=${PORT}" >> $GITHUB_ENV
          npm ci
          cd ../back
          cp .env.ci .env
          npm ci
          cd ..

      - name: Run back and front
        run: |
          cd front
          npm run start &
          cd ../back
          npm run start &
          cd ..

      - name: Cypress run
        run: |
          cd front
          node_modules/cypress/bin/cypress run --env FRONT_URL=localhost:$PORT
          cd ..
  

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: [ tests-local ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set remote_path based on branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "REMOTE_PATH=/srv/defiQrCode" >> $GITHUB_ENV
            echo "PM2_APP_NAME=defiQrCodeBack" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "REMOTE_PATH=/srv/defiQrCodeDev" >> $GITHUB_ENV
            echo "PM2_APP_NAME=defiQrCodeBackDev" >> $GITHUB_ENV
          fi

      - name: Sync files to Server
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avz --delete --exclude=back/.env --exclude=front/.env
          remote_host: ${{ secrets.HOST_LWS_SERVER }}
          remote_user: ${{ secrets.USERNAME_LWS_SERVER }}
          remote_key: ${{ secrets.SSH_KEY_LWS_SERVER }}
          path: "."
          remote_path: ${{ env.REMOTE_PATH }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_LWS_SERVER }}
          username: ${{ secrets.USERNAME_LWS_SERVER }}
          password: ${{ secrets.PASSWORD_LWS_SERVER }}
          script: |
            cd ${{ env.REMOTE_PATH }}
            cd front
            npm ci
            npm run build
            cd ..
            cd back
            npm ci
            pm2 delete ${{ env.PM2_APP_NAME }}
            pm2 --name ${{ env.PM2_APP_NAME }} start npm -- start

  tests-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: [ tests-local, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set remote_path based on branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "FRONT_URL=https://courir-a-plusieurs.site" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "FRONT_URL=https://defiqrcodedev.lucasbodin.com" >> $GITHUB_ENV
          fi

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.15.0'

      - name: Install dependencies
        run: |
          cd front
          cp .env.ci .env
          npm ci
          cd ..

      - name: Cypress run
        run: |
          cd front
          node_modules/cypress/bin/cypress run --spec cypress/e2e/front/access_front_page.cy.js --env FRONT_URL=$FRONT_URL
          cd ..
