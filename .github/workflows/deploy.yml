name: Deploy Node.js app to server

on:
  push:
    branches:
      - main
      - dev

env:
  REMOTE_PATH: ''

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set remote_path based on branch
        run: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "REMOTE_PATH=/srv/defiQrCode" >> $GITHUB_ENV
            elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
              echo "REMOTE_PATH=/srv/defiQrCodeDev" >> $GITHUB_ENV
            fi

      - name: Sync files to Server
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avz --delete --exclude=back/.env --exclude=front/node_modules --exclude=back/node_modules
          remote_host: ${{ secrets.HOST_LWS_SERVER }}
          remote_user: ${{ secrets.USERNAME_LWS_SERVER }}
          remote_key: ${{ secrets.SSH_KEY_LWS_SERVER }}
          path: "."
          remote_path: ${{ env.REMOTE_PATH }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_LWS_SERVER }}
          username: ${{ secrets.USERNAME_LWS_SERVER }}
          password: ${{ secrets.PASSWORD_LWS_SERVER }}
          script: |
            cd ${{ env.REMOTE_PATH }}
            cd front
            npm i
            npm run build
            cd ..
            cd back
            npm i
            pm2 delete defiQrCodeBack
            pm2 --name defiQrCodeBack start npm -- start
